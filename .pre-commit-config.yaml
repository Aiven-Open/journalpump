repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
    -   id: ruff-check
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: pylint
        name: pylint
        entry: make pylint
        language: system
        types: [python]
        pass_filenames: false
    -   id: mypy
        name: mypy
        entry: make mypy
        language: system
        types: [python]
        pass_filenames: false
