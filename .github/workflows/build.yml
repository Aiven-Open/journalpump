name: Build journalpump

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:

jobs:

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # only use oldest and newest version for the lint step
        python-version: ["3.10", "3.14"]

    steps:

      - id: checkout-code
        uses: actions/checkout@v6

      - id: system-dependencies
        timeout-minutes: 5
        run: |
          # Prefer azure.archive.ubuntu.com (fast from these VMs). Apt already
          # lists archive.ubuntu.com as a fallback, but failover is per-file and
          # a TCP stall never counts as failure, so it can hang for hours.
          # https://github.com/actions/runner-images/issues/12949
          apt_get() {
            sudo DEBIAN_FRONTEND=noninteractive timeout -k 5 45 apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              "$@"
          }
          pin_archive() {
            for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$f" ]; then
                sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"
              fi
            done
          }
          if ! apt_get update || ! apt_get install -y libsystemd-dev libsnappy-dev; then
            echo "Azure Ubuntu mirror failed or timed out; pinning to archive.ubuntu.com"
            pin_archive
            apt_get update
            apt_get install -y libsystemd-dev libsnappy-dev
          fi

      - id: prepare-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - id: python-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.dev.txt

      - id: pre-commit
        run: pre-commit run --all

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - id: checkout-code
        uses: actions/checkout@v6

      - id: system-dependencies
        timeout-minutes: 5
        run: |
          # Prefer azure.archive.ubuntu.com (fast from these VMs). Apt already
          # lists archive.ubuntu.com as a fallback, but failover is per-file and
          # a TCP stall never counts as failure, so it can hang for hours.
          # https://github.com/actions/runner-images/issues/12949
          apt_get() {
            sudo DEBIAN_FRONTEND=noninteractive timeout -k 5 45 apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              "$@"
          }
          pin_archive() {
            for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$f" ]; then
                sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"
              fi
            done
          }
          if ! apt_get update || ! apt_get install -y libsystemd-dev libsnappy-dev; then
            echo "Azure Ubuntu mirror failed or timed out; pinning to archive.ubuntu.com"
            pin_archive
            apt_get update
            apt_get install -y libsystemd-dev libsnappy-dev
          fi

      - id: prepare-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - id: python-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade -r requirements.dev.txt
          pip install -e .

      - id: unittest
        run: make unittest

      - id: systest
        run: make systest
