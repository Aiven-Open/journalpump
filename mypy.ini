[mypy]
python_version = 3.13
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
warn_unused_ignores = True
disallow_any_generics = True

# google-auth ships py.typed, but some factories (auth.default,
# service_account.Credentials.from_service_account_info) have no annotations.
# Whether they are annotated varies by google-auth version; excluding them here
# keeps version-sensitive "type: ignore" comments out of call sites.
untyped_calls_exclude = google.auth, google.oauth2.service_account

[mypy-re2,systemd,systemd.*,zstandard]
ignore_missing_imports = True
